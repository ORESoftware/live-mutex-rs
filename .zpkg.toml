[package]
org = "oresoftware"
name = "live-mutex-rs"
version = "0.1.127"
description = "Rust network mutex broker and polyglot clients with fencing-token safety contracts"
license = "MIT"
keywords = ["mutex", "distributed-lock", "fencing", "rust", "polyglot"]
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/ORESoftware/live-mutex-rs"

# This is intentionally a single Zed source package for the whole repository.
# `clients/`, `formal/`, and the Rust broker therefore travel together through
# Zed instead of being mis-declared as independently published language targets.
[install]
dir = ".vendor/.zed"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = 'test -f "$ZED_PKG_TEST_TARGET/Cargo.toml" && test -f "$ZED_PKG_TEST_TARGET/src/lib.rs" && test -f "$ZED_PKG_TEST_TARGET/formal/README.md" && test -d "$ZED_PKG_TEST_TARGET/clients" && cd "$ZED_PKG_TEST_TARGET" && cargo check --locked'
exclude = [
  ".env",
  ".env.*",
  ".direnv/**",
  ".zed/**",
  ".zed-pack/**",
  ".vendor/.zed/**",
  "target/**",
  "**/target/**",
  "tmp/**",
  "**/*.log",
  ".DS_Store",
]

# Cargo/crates.io policy remains independent. Cargo.toml currently has
# publish=false, so Zed adds a source/provenance channel without silently
# changing native-registry publication policy.
[scripts]
test = "cargo test --all-targets --locked"
