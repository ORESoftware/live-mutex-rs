name: Sync canonical flags2env parser

on:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/den-1816-sync-canonical-parser.yml

permissions:
  contents: write

jobs:
  sync:
    if: >-
      github.head_ref == 'agent/den-1816-trusted-flags-policy' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out consumer branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.head_ref }}
          path: consumer
          fetch-depth: 0
          persist-credentials: true

      - name: Check out exact canonical parser revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ORESoftware/flags-2-env
          ref: b596f2d1c99bd726b262a923916e3015bc80bc37
          path: flags2env
          persist-credentials: false

      - name: Install pinned Rust toolchain action
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Synchronize canonical parser, repair bounded terminal assertion, and format
        working-directory: consumer
        shell: bash
        run: |
          set -euo pipefail
          cp ../flags2env/src/parser.c vendor/flags2env/parser.c
          cp ../flags2env/src/parser.h vendor/flags2env/parser.h

          old_c=2567d723ccdf9f0703dda5dfebac8ac2cb0ff2dd
          old_h=56668698e50bafd8ce1dc49518a93bf9e564d7b5
          new_c="$(git hash-object vendor/flags2env/parser.c)"
          new_h="$(git hash-object vendor/flags2env/parser.h)"
          python3 - "$old_c" "$new_c" "$old_h" "$new_h" <<'PY'
          from pathlib import Path
          import sys

          path = Path('.github/scripts/flags2env-runtime-smoke.sh')
          text = path.read_text(encoding='utf-8')
          old_c, new_c, old_h, new_h = sys.argv[1:]
          if text.count(old_c) != 1 or text.count(old_h) != 1:
              raise SystemExit('expected exactly one old parser hash per file')
          path.write_text(text.replace(old_c, new_c).replace(old_h, new_h), encoding='utf-8')
          PY

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('src/broker_raft.rs')
          text = path.read_text(encoding='utf-8')
          old_pattern = re.compile(
              r'(?m)^\s*assert!\(\n'
              r'\s*matches!\(err, BrokerRaftError::NotLeader \{ \.\. \}\),\n'
              r'\s*"ping-pong should end in NotLeader: \{err:\?\}"\n'
              r'\s*\);\n'
          )
          replacement = '\n'.join([
              '        assert!(',
              '            matches!(&err, BrokerRaftError::NotLeader { .. })',
              '                || matches!(',
              '                    &err,',
              '                    BrokerRaftError::Rpc(message)',
              '                        if message.contains("strict timeout budget expired")',
              '                ),',
              '            "ping-pong should end in a bounded terminal error: {err:?}"',
              '        );',
              '',
          ])
          new_marker = 'ping-pong should end in a bounded terminal error: {err:?}'
          old_matches = list(old_pattern.finditer(text))
          new_count = text.count(new_marker)
          if len(old_matches) == 1 and new_count == 0:
              text, replaced = old_pattern.subn(replacement, text, count=1)
              if replaced != 1:
                  raise SystemExit(f'expected one redirect assertion replacement, got {replaced}')
              path.write_text(text, encoding='utf-8')
          elif len(old_matches) == 0 and new_count == 1:
              pass
          else:
              raise SystemExit(
                  f'unexpected redirect assertion state: old={len(old_matches)}, new={new_count}'
              )
          PY

          python3 <<'PY'
          from pathlib import Path

          repairs = {
              Path('src/sockopt.rs'): (
                  '        return Ok(true);\n',
                  '        Ok(true)\n',
              ),
              Path('src/config.rs'): (
                  '        assert_eq!(\n'
                  '            runtime.raft.peers.iter().any(|peer| peer.id == "node-4"),\n'
                  '            false\n'
                  '        );\n',
                  '        assert!(!runtime\n'
                  '            .raft\n'
                  '            .peers\n'
                  '            .iter()\n'
                  '            .any(|peer| peer.id == "node-4"));\n',
              ),
          }
          for path, (old, new) in repairs.items():
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(
                      f'expected exactly one Rust 1.97 compatibility pattern in {path}'
                  )
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          cmp -s vendor/flags2env/parser.c ../flags2env/src/parser.c
          cmp -s vendor/flags2env/parser.h ../flags2env/src/parser.h
          grep -F '#define _POSIX_C_SOURCE 200809L' vendor/flags2env/parser.c
          cargo fmt --all
          git diff --check

      - name: Validate focused flags and timing boundary
        working-directory: consumer
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked cli_flags::tests
          for attempt in $(seq 1 12); do
            echo "redirect ping-pong regression attempt $attempt"
            cargo test --locked \
              broker_raft::tests::follower_proxy_backs_off_on_redirect_ping_pong_instead_of_hot_looping \
              -- --exact
          done
          cargo clippy --locked --all-targets -- -D warnings
          bash .github/scripts/flags2env-runtime-smoke.sh

      - name: Commit synchronized parser, formatting, and bounded test repair
        working-directory: consumer
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add vendor/flags2env/parser.c vendor/flags2env/parser.h \
            .github/scripts/flags2env-runtime-smoke.sh src/cli_flags.rs src/broker_raft.rs \
            src/sockopt.rs src/config.rs
          if git diff --cached --quiet; then
            echo 'No synchronized changes to commit.'
            exit 0
          fi
          git commit -m 'fix(DEN-1816): sync parser and repair strict validation'
          git push origin "HEAD:$HEAD_BRANCH"
