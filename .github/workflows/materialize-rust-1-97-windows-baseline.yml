name: Materialize remaining Rust 1.97 Windows baseline fixes

on:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/materialize-rust-1-97-windows-baseline.yml

permissions:
  contents: write

jobs:
  materialize:
    if: >-
      github.head_ref == 'fix/rust-1-97-clippy-baseline' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact product branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Apply fail-closed platform baseline repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          broker = Path('src/broker_raft.rs')
          broker_text = broker.read_text(encoding='utf-8')
          broker_old = 'const DATA_DIR_LOCK_FILE: &str = "broker-raft.lock";\n'
          broker_new = '#[cfg(unix)]\nconst DATA_DIR_LOCK_FILE: &str = "broker-raft.lock";\n'
          if broker_text.count(broker_old) != 1 or broker_new in broker_text:
              raise SystemExit('unexpected DATA_DIR_LOCK_FILE source shape')
          broker.write_text(broker_text.replace(broker_old, broker_new, 1), encoding='utf-8')

          config = Path('src/config.rs')
          config_text = config.read_text(encoding='utf-8')
          type_old = '        source: toml::de::Error,\n'
          type_new = '        source: Box<toml::de::Error>,\n'
          ctor_old = '    toml::from_str(&text).map_err(|source| ConfigError::Parse {\n        path: path.to_path_buf(),\n        source,\n    })\n'
          ctor_new = '    toml::from_str(&text).map_err(|source| ConfigError::Parse {\n        path: path.to_path_buf(),\n        source: Box::new(source),\n    })\n'
          if config_text.count(type_old) != 1 or type_new in config_text:
              raise SystemExit('unexpected ConfigError::Parse type shape')
          if config_text.count(ctor_old) != 1 or ctor_new in config_text:
              raise SystemExit('unexpected ConfigError::Parse constructor shape')
          config_text = config_text.replace(type_old, type_new, 1)
          config_text = config_text.replace(ctor_old, ctor_new, 1)
          config.write_text(config_text, encoding='utf-8')
          PY
          cargo fmt --all
          git diff --check

      - name: Validate Linux baseline before publishing candidate
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Run strict product checks
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked config::tests --lib

      - name: Commit product-only repair and delete materializer
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-rust-1-97-windows-baseline.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/broker_raft.rs src/config.rs \
            .github/workflows/materialize-rust-1-97-windows-baseline.yml
          git diff --cached --check
          git commit -m 'fix: complete Windows Rust 1.97 strict-Clippy baseline'
          git push origin "HEAD:$HEAD_BRANCH"
