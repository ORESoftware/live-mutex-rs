name: Materialize Windows transport boundary

on:
  push:
    branches:
      - fix/rust-1-97-clippy-baseline
    paths:
      - .github/workflows/materialize-windows-transport-boundary.yml
      - .github/scripts/disambiguate-client-uds-materializer.py
      - .github/scripts/materialize-windows-transport-boundary.py

permissions:
  contents: write

concurrency:
  group: windows-transport-boundary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact cleanup branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: fix/rust-1-97-clippy-baseline
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchain action
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Materialize portable transport boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/disambiguate-client-uds-materializer.py
          python3 .github/scripts/materialize-windows-transport-boundary.py

      - name: Verify Unix behavior remains strict
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          actual="$(git diff --name-only | sort | paste -sd ' ' -)"
          test "$actual" = 'src/client.rs src/server.rs src/sockopt.rs'
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked sockopt::tests -- --nocapture
          cargo test --locked client::tests -- --nocapture

      - name: Commit only the transport boundary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/client.rs src/server.rs src/sockopt.rs
          actual="$(git diff --cached --name-only | sort | paste -sd ' ' -)"
          test "$actual" = 'src/client.rs src/server.rs src/sockopt.rs'
          git commit -m 'fix: compile TCP transport on Windows'
          git push origin HEAD:fix/rust-1-97-clippy-baseline
