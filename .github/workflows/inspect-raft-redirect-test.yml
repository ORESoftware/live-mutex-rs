name: inspect raft redirect regression

on:
  push:
    branches:
      - test/raft-redirect-cycle-oracle-20260925
    paths:
      - .github/workflows/inspect-raft-redirect-test.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect retry cadence and full ping-pong oracle
        shell: bash
        run: |
          set -euo pipefail
          echo '===== retry interval definitions/usages ====='
          grep -n -C 4 'PROXY_RETRY_INTERVAL' src/broker_raft.rs || true
          echo '===== ping-pong helper + test ====='
          sed -n '56440,56610p' src/broker_raft.rs
