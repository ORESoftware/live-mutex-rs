name: inspect raft redirect regression

on:
  push:
    branches:
      - test/raft-redirect-cycle-oracle-20260925
    paths:
      - .github/workflows/inspect-raft-redirect-test.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect follower proxy redirect loop
        shell: bash
        run: |
          set -euo pipefail
          sed -n '10920,11270p' src/broker_raft.rs
