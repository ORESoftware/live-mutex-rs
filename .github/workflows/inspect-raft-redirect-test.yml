name: inspect raft redirect regression

on:
  push:
    branches:
      - test/raft-redirect-cycle-oracle-20260925
    paths:
      - .github/workflows/inspect-raft-redirect-test.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print redirect regression context
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('src/broker_raft.rs').read_text()
          needles = [
              'proxy_rejects_permanent_redirect_ping_pong',
              'proxy_retry_backoff',
              'strict timeout budget expired',
              'attempted_peers',
              'redirect_cycle_detected',
          ]
          for needle in needles:
              print(f'===== {needle} =====')
              start = 0
              found = False
              while True:
                  idx = src.find(needle, start)
                  if idx < 0:
                      break
                  found = True
                  lo = max(0, idx - 4500)
                  hi = min(len(src), idx + 9000)
                  print(src[lo:hi])
                  print('\n===== MATCH END =====\n')
                  start = idx + len(needle)
                  if needle == 'proxy_rejects_permanent_redirect_ping_pong':
                      break
              if not found:
                  print('not found')
          PY
