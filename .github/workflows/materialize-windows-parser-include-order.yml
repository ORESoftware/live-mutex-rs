name: Materialize Windows parser include order

on:
  push:
    branches:
      - fix/rust-1-97-clippy-baseline
    paths:
      - .github/workflows/materialize-windows-parser-include-order.yml

permissions:
  contents: write

concurrency:
  group: windows-parser-include-order-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact consumer branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: fix/rust-1-97-clippy-baseline
          path: consumer
          fetch-depth: 0
          persist-credentials: true

      - name: Check out canonical parser revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ORESoftware/flags-2-env
          ref: b596f2d1c99bd726b262a923916e3015bc80bc37
          path: canonical
          persist-credentials: false

      - name: Apply only the canonical Windows header order
        working-directory: consumer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          consumer = Path('vendor/flags2env/parser.c')
          canonical = Path('../canonical/src/parser.c')
          text = consumer.read_text(encoding='utf-8')
          canonical_text = canonical.read_text(encoding='utf-8')
          old = '''#elif defined(_WIN32)
          #include <shellapi.h>
          #include <windows.h>
          #endif'''.replace('          ', '')
          new = '''#elif defined(_WIN32)
          #include <windows.h>
          #include <shellapi.h>
          #endif'''.replace('          ', '')
          if canonical_text.count(new) != 1:
              raise SystemExit('canonical parser does not contain the reviewed Windows include order')
          if text.count(old) != 1 or text.count(new) != 0:
              raise SystemExit('unexpected vendored Windows include order')
          consumer.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = 'vendor/flags2env/parser.c'
          grep -A2 -F '#elif defined(_WIN32)' vendor/flags2env/parser.c \
            | grep -F '#include <windows.h>'

      - name: Commit the one-line portability repair
        working-directory: consumer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add vendor/flags2env/parser.c
          test "$(git diff --cached --name-only)" = 'vendor/flags2env/parser.c'
          git commit -m 'fix: include windows.h before shellapi.h'
          git push origin HEAD:fix/rust-1-97-clippy-baseline
