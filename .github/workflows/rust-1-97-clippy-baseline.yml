name: Materialize Rust 1.97 Clippy baseline

on:
  push:
    branches:
      - fix/rust-1-97-clippy-baseline
    paths:
      - .github/workflows/rust-1-97-clippy-baseline.yml

permissions:
  contents: write

concurrency:
  group: rust-1-97-clippy-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact cleanup branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: fix/rust-1-97-clippy-baseline
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchain action
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Apply only the four observed Rust 1.97 lint migrations
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          sockopt = Path('src/sockopt.rs')
          sockopt_text = sockopt.read_text(encoding='utf-8')
          old_return = '        return Ok(true);'
          new_return = '        Ok(true)'
          if sockopt_text.count(old_return) != 1 or sockopt_text.count(new_return) != 0:
              raise SystemExit('unexpected TCP_QUICKACK return shape')
          sockopt.write_text(sockopt_text.replace(old_return, new_return), encoding='utf-8')

          config = Path('src/config.rs')
          config_text = config.read_text(encoding='utf-8')
          boolean_pattern = re.compile(
              r'(?P<indent>^[ \t]*)assert_eq!\(\s*'
              r'runtime\.raft\.peers\.iter\(\)\.any\(\|peer\| peer\.id == "node-4"\),\s*'
              r'false\s*'
              r'\);',
              re.MULTILINE,
          )
          matches = list(boolean_pattern.finditer(config_text))
          replacement = (
              r'\g<indent>assert!(!runtime.raft.peers.iter().any(|peer| peer.id == "node-4"));'
          )
          if len(matches) != 1:
              raise SystemExit(f'expected one boolean comparison assertion, got {len(matches)}')
          config_text, count = boolean_pattern.subn(replacement, config_text, count=1)
          if count != 1:
              raise SystemExit(f'expected one config replacement, got {count}')
          config.write_text(config_text, encoding='utf-8')

          integration = Path('tests/extra_locking_semaphore_multikey.rs')
          integration_text = integration.read_text(encoding='utf-8')
          import_anchor = 'use tokio::sync::mpsc::UnboundedReceiver;\n\n'
          type_alias = (
              'type CompositeGrant = (\n'
              '    bool,\n'
              '    Option<String>,\n'
              '    Option<std::collections::BTreeMap<String, u64>>,\n'
              ');\n\n'
          )
          old_signature = (
              'fn composite_grant(\n'
              '    msgs: &[Response],\n'
              ') -> Option<(\n'
              '    bool,\n'
              '    Option<String>,\n'
              '    Option<std::collections::BTreeMap<String, u64>>,\n'
              ')> {\n'
          )
          new_signature = 'fn composite_grant(msgs: &[Response]) -> Option<CompositeGrant> {\n'
          if integration_text.count(import_anchor) != 1:
              raise SystemExit('expected one integration-test import anchor')
          if integration_text.count(old_signature) != 1 or integration_text.count(new_signature) != 0:
              raise SystemExit('unexpected composite helper signature')
          integration_text = integration_text.replace(
              import_anchor,
              import_anchor + type_alias,
              1,
          ).replace(old_signature, new_signature, 1)
          integration.write_text(integration_text, encoding='utf-8')

          raft_smoke = Path('tests/k8s_raft_live_smoke.rs')
          raft_smoke_text = raft_smoke.read_text(encoding='utf-8')
          old_then = '    found.then(|| total as u64)'
          new_then = '    found.then_some(total as u64)'
          if raft_smoke_text.count(old_then) != 1 or raft_smoke_text.count(new_then) != 0:
              raise SystemExit('unexpected k8s raft bool::then shape')
          raft_smoke.write_text(
              raft_smoke_text.replace(old_then, new_then),
              encoding='utf-8',
          )
          PY
          cargo fmt --all
          git diff --check
          test "$(git diff --name-only | sort | paste -sd ' ' -)" = 'src/config.rs src/sockopt.rs tests/extra_locking_semaphore_multikey.rs tests/k8s_raft_live_smoke.rs'

      - name: Verify strict lint and focused behavior
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked config::tests -- --nocapture
          cargo test --locked sockopt::tests -- --nocapture
          cargo test --locked --test extra_locking_semaphore_multikey -- --nocapture
          cargo test --locked --test k8s_raft_live_smoke --no-run

      - name: Commit the bounded baseline repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/config.rs src/sockopt.rs \
            tests/extra_locking_semaphore_multikey.rs tests/k8s_raft_live_smoke.rs
          test "$(git diff --cached --name-only | sort | paste -sd ' ' -)" = 'src/config.rs src/sockopt.rs tests/extra_locking_semaphore_multikey.rs tests/k8s_raft_live_smoke.rs'
          git commit -m 'fix: satisfy Rust 1.97 Clippy baseline'
          git push origin HEAD:fix/rust-1-97-clippy-baseline
